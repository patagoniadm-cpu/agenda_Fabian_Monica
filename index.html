<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agenda AOCA · Mónica ↔ Fabián</title>
<style>
  :root{
    --indigo:#2F2B84; --indigo-dark:#221F5F; --orange:#FF7A00; --green:#5BA646;
    --amber:#E8A93A; --bg:#F5F5FA; --card:#FFFFFF; --muted:#8A87AD; --text:#2A2750;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Inter',Helvetica,Arial,sans-serif;color:var(--text);}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::placeholder{color:#A6A3C4;}

  header{background:linear-gradient(135deg,var(--indigo),var(--indigo-dark));padding:28px 20px 40px;color:#fff;}
  header .inner{max-width:560px;margin:0 auto;}
  .eyebrow{display:flex;align-items:center;gap:8px;opacity:.85;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;}
  .dot{width:8px;height:8px;border-radius:99px;background:var(--orange);display:inline-block;}
  h1{font-size:28px;font-weight:800;margin:8px 0 6px;line-height:1.2;}
  .people{display:flex;align-items:center;gap:8px;font-size:15px;opacity:.9;}
  .avatar{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:99px;color:#fff;font-size:9px;font-weight:800;}

  main{max-width:560px;margin:-22px auto 0;padding:0 16px 80px;}
  .card{background:var(--card);border-radius:16px;box-shadow:0 8px 24px rgba(47,43,132,.12);padding:16px;}

  .btn-add{width:100%;background:var(--orange);color:#fff;border:none;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;}
  .form input[type=text], .form textarea, .form input[type=date]{width:100%;border:2px solid #E4E2F3;border-radius:10px;padding:10px 14px;font-size:15px;outline:none;margin-bottom:10px;}
  .form textarea{resize:none;}
  .owner-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .chip-toggle{border:2px solid #E4E2F3;background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--indigo);}
  .chip-toggle.active{border-color:var(--indigo);background:#ECEBF7;}
  .form-actions{display:flex;gap:8px;}
  .btn-cancel{flex:1;background:#F0EFF8;border:none;border-radius:10px;padding:12px;font-weight:600;color:#6C68A0;}
  .btn-save{flex:2;background:var(--orange);border:none;border-radius:10px;padding:12px;font-weight:700;color:#fff;}
  .btn-save:disabled{background:#F3D5B0;}

  .filters{display:flex;gap:6px;margin-top:18px;overflow-x:auto;padding-bottom:2px;}
  .filter-btn{white-space:nowrap;border:none;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;background:#fff;color:#6C68A0;box-shadow:0 1px 3px rgba(47,43,132,.1);}
  .filter-btn.active{background:var(--indigo);color:#fff;box-shadow:none;}

  .list{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .empty, .loading{text-align:center;padding:40px 20px;color:var(--muted);background:#fff;border-radius:16px;}
  .item{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(47,43,132,.06);}
  .item-top{display:flex;justify-content:space-between;gap:8px;}
  .item-title{font-size:16px;font-weight:700;line-height:1.3;}
  .item-detail{font-size:13.5px;color:#726F9A;margin-top:3px;}
  .del-btn{border:none;background:transparent;color:#C6C3E0;padding:4px;font-size:16px;}
  .item-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;}
  .pill{border:none;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px;text-decoration:none;}
  .pill-owner{background:#F0EFF8;color:#726F9A;font-size:12px;}
  .pill-cal{background:#ECEBF7;color:var(--indigo);font-size:12px;}
  .time-ago{font-size:11px;color:#B3B0D1;margin-left:auto;}

  footer{text-align:center;margin-top:24px;font-size:12px;color:#A6A3C4;}

  .who-overlay{position:fixed;inset:0;background:rgba(34,31,95,.85);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .who-card{background:#fff;border-radius:16px;padding:24px;max-width:340px;width:100%;text-align:center;}
  .who-card h2{font-size:18px;margin:0 0 4px;}
  .who-card p{font-size:13px;color:var(--muted);margin:0 0 18px;}
  .who-btn{display:block;width:100%;border:2px solid #E4E2F3;background:#fff;border-radius:12px;padding:14px;font-size:15px;font-weight:700;margin-bottom:10px;color:var(--text);}
  .who-btn:last-child{margin-bottom:0;}
  .who-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;opacity:.85;margin-top:6px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;}
  .who-badge button{background:none;border:none;color:#fff;text-decoration:underline;font-size:12px;opacity:.85;padding:0;}
</style>
</head>
<body>

<div class="who-overlay" id="whoOverlay" style="display:none;">
  <div class="who-card">
    <h2>¿Quién sos?</h2>
    <p>Así sabemos a quién avisarle por mail cuando cargues algo.</p>
    <button class="who-btn" data-who="MM">Soy Mónica</button>
    <button class="who-btn" data-who="FM">Soy Fabián</button>
  </div>
</div>

<header>
  <div class="inner">
    <div class="eyebrow"><span class="dot"></span>AOCA</div>
    <h1>Agenda de seguimiento</h1>
    <div class="people">
      <span style="display:flex;align-items:center;gap:6px;"><span class="avatar" style="background:#2F2B84;">MM</span> Mónica</span>
      <span style="opacity:.6;">→</span>
      <span style="display:flex;align-items:center;gap:6px;"><span class="avatar" style="background:#FF7A00;">FM</span> Fabián</span>
    </div>
    <div class="who-badge" id="whoBadge"></div>
  </div>
</header>

<main>
  <div class="card">
    <button class="btn-add" id="openFormBtn">+ Agregar tema</button>
    <div class="form" id="form" style="display:none;">
      <input type="text" id="fTitle" placeholder="¿Qué tema hablaron?" />
      <textarea id="fDetail" rows="2" placeholder="Detalle o contexto (opcional)"></textarea>
      <div class="owner-row" id="ownerRow">
        <button class="chip-toggle" data-owner="MM">Sigue: Mónica</button>
        <button class="chip-toggle" data-owner="FM">Sigue: Fabián</button>
        <button class="chip-toggle active" data-owner="AM">Sigue: Ambos</button>
      </div>
      <input type="date" id="fFollowUp" />
      <div class="form-actions">
        <button class="btn-cancel" id="cancelBtn">Cancelar</button>
        <button class="btn-save" id="saveBtn" disabled>Guardar</button>
      </div>
    </div>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="activos">Activos</button>
    <button class="filter-btn" data-filter="pendiente">Pendientes</button>
    <button class="filter-btn" data-filter="en_curso">En curso</button>
    <button class="filter-btn" data-filter="resuelto">Resueltos</button>
    <button class="filter-btn" data-filter="todos">Todos</button>
  </div>

  <div class="list" id="list">
    <div class="loading">Cargando agenda…</div>
  </div>

  <footer id="statusLine">Los cambios se ven al instante en ambos celulares</footer>
</main>

<script>
// ⚠️ PEGÁ ACÁ LA URL DE TU APPS SCRIPT (termina en /exec)
const API_URL = "https://script.google.com/macros/s/AKfycbxxA2ajnsKDzc69_HkY0fPbMlWAQwuUuj1_RiGiXBx7pYfrwheYLhPxDfjbPMDYMlHMsg/exec";

const STATUS = {
  pendiente: { label: "Pendiente", color: "#E8A93A", bg: "#FDF4E3" },
  en_curso:  { label: "En curso",  color: "#2F2B84", bg: "#ECEBF7" },
  resuelto:  { label: "Resuelto",  color: "#5BA646", bg: "#EAF4EB" },
};
const OWNERS = { MM: "Mónica", FM: "Fabián", AM: "Ambos" };

let items = [];
let filter = "activos";
let selectedOwner = "AM";
let currentUser = localStorage.getItem("agenda_who_am_i") || null;
const WHO_NAMES = { MM: "Mónica", FM: "Fabián" };

const $ = (sel) => document.querySelector(sel);
const listEl = $("#list");
const statusLine = $("#statusLine");

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function toISODate(d){ return d.toISOString().slice(0,10); }

function gcalUrl(title, detail, dateStr){
  const start = new Date(dateStr + "T00:00:00");
  const end = new Date(start); end.setDate(end.getDate()+1);
  const fmt = (d) => toISODate(d).replace(/-/g,"");
  const params = new URLSearchParams({
    action:"TEMPLATE", text:title,
    details:(detail||"") + "\n\n(vía Agenda AOCA)",
    dates: fmt(start)+"/"+fmt(end)
  });
  return "https://calendar.google.com/calendar/render?" + params.toString();
}

function timeAgo(ts){
  const diff = Math.max(0, Date.now() - ts);
  const min = Math.floor(diff/60000);
  if (min < 1) return "recién";
  if (min < 60) return `hace ${min} min`;
  const hr = Math.floor(min/60);
  if (hr < 24) return `hace ${hr} h`;
  return `hace ${Math.floor(hr/24)} d`;
}

async function apiCall(payload){
  statusLine.textContent = "Guardando…";
  try{
    const res = await fetch(API_URL, { method:"POST", body: JSON.stringify(payload) });
    const data = await res.json();
    items = data;
    render();
    statusLine.textContent = "Los cambios se ven al instante en ambos celulares";
  }catch(e){
    statusLine.textContent = "No se pudo guardar. Revisá tu conexión.";
  }
}

async function load(){
  try{
    const res = await fetch(API_URL);
    items = await res.json();
    render();
  }catch(e){
    listEl.innerHTML = '<div class="empty">No se pudo cargar. Revisá la URL de API_URL en el código.</div>';
  }
}

function addItem(){
  const title = $("#fTitle").value.trim();
  if (!title) return;
  const item = {
    id: uid(),
    title,
    detail: $("#fDetail").value.trim(),
    owner: selectedOwner,
    status: "pendiente",
    followUp: $("#fFollowUp").value || "",
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  apiCall({ action:"add", item, actor: currentUser });
  $("#fTitle").value=""; $("#fDetail").value=""; $("#fFollowUp").value="";
  selectedOwner="AM"; updateOwnerChips();
  $("#form").style.display="none";
  $("#saveBtn").disabled = true;
}

function cycleStatus(id){
  const order = ["pendiente","en_curso","resuelto"];
  const it = items.find(i=>i.id===id);
  if(!it) return;
  const next = order[(order.indexOf(it.status)+1) % order.length];
  apiCall({ action:"update", item:{ id, status: next, updatedAt: Date.now() }, actor: currentUser });
}

function removeItem(id){
  apiCall({ action:"delete", id });
}

function updateOwnerChips(){
  document.querySelectorAll('#ownerRow .chip-toggle').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.owner === selectedOwner);
  });
}

function render(){
  const filtered = items.filter(it=>{
    if (filter === "todos") return true;
    if (filter === "activos") return it.status !== "resuelto";
    return it.status === filter;
  }).sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));

  if (filtered.length === 0){
    listEl.innerHTML = '<div class="empty"><div style="font-weight:600;margin-bottom:4px;">Sin temas acá todavía</div><div style="font-size:13px;">Tocá "Agregar tema" para sumar lo que hablaron.</div></div>';
    return;
  }

  listEl.innerHTML = filtered.map(it=>{
    const s = STATUS[it.status] || STATUS.pendiente;
    const ownerLabel = OWNERS[it.owner] || "Ambos";
    const calChip = it.followUp ? `<a class="pill pill-cal" href="${gcalUrl(it.title,it.detail,it.followUp)}" target="_blank" rel="noopener">📅 ${new Date(it.followUp+"T00:00:00").toLocaleDateString("es-AR",{day:"2-digit",month:"short"})}</a>` : "";
    return `
      <div class="item" style="border-left:5px solid ${s.color};">
        <div class="item-top">
          <div>
            <div class="item-title">${escapeHtml(it.title)}</div>
            ${it.detail ? `<div class="item-detail">${escapeHtml(it.detail)}</div>` : ""}
          </div>
          <button class="del-btn" onclick="removeItem('${it.id}')">🗑</button>
        </div>
        <div class="item-meta">
          <button class="pill" style="background:${s.bg};color:${s.color};" onclick="cycleStatus('${it.id}')">✓ ${s.label}</button>
          <span class="pill pill-owner">${ownerLabel}</span>
          ${calChip}
          <span class="time-ago">${timeAgo(it.updatedAt||it.createdAt||Date.now())}</span>
        </div>
      </div>`;
  }).join("");
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str || "";
  return d.innerHTML;
}

// Eventos
$("#openFormBtn").addEventListener("click", ()=>{
  $("#form").style.display="block";
  $("#openFormBtn").style.display="none";
});
$("#cancelBtn").addEventListener("click", ()=>{
  $("#form").style.display="none";
  $("#openFormBtn").style.display="block";
});
$("#fTitle").addEventListener("input", (e)=>{
  $("#saveBtn").disabled = !e.target.value.trim();
});
$("#saveBtn").addEventListener("click", addItem);
document.querySelectorAll('#ownerRow .chip-toggle').forEach(btn=>{
  btn.addEventListener("click", ()=>{ selectedOwner = btn.dataset.owner; updateOwnerChips(); });
});
document.querySelectorAll('#filters .filter-btn').forEach(btn=>{
  btn.addEventListener("click", ()=>{
    filter = btn.dataset.filter;
    document.querySelectorAll('#filters .filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

function renderWhoBadge(){
  const badge = $("#whoBadge");
  if (!currentUser){ badge.innerHTML = ""; return; }
  badge.innerHTML = `Estás como: ${WHO_NAMES[currentUser]} <button id="changeWhoBtn">(cambiar)</button>`;
  $("#changeWhoBtn").addEventListener("click", ()=>{
    currentUser = null;
    localStorage.removeItem("agenda_who_am_i");
    renderWhoBadge();
    $("#whoOverlay").style.display = "flex";
  });
}

document.querySelectorAll('.who-btn').forEach(btn=>{
  btn.addEventListener("click", ()=>{
    currentUser = btn.dataset.who;
    localStorage.setItem("agenda_who_am_i", currentUser);
    $("#whoOverlay").style.display = "none";
    renderWhoBadge();
  });
});

if (!currentUser){ $("#whoOverlay").style.display = "flex"; }
renderWhoBadge();

load();
setInterval(load, 8000);
</script>
</body>
</html>
